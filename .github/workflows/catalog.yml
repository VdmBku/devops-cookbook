name: catalog

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Test the catalog tool
        run: python -m pytest -q
      - name: Validate every template.yaml and check the catalog is current
        run: python tools/catalog.py --check
